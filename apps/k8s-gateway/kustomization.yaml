---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - coredns-custom.yaml

helmCharts:
  - name: k8s-gateway
    repo: oci://codeberg.org/k8s-gateway/charts/k8s-gateway
    namespace: kube-system
    version: 3.7.4
    releaseName: excoredns
    valuesFile: values.yaml

patches:
  - path: metrics-port-patch.yaml
    target:
      kind: Service
      name: excoredns-k8s-gateway
      version: v1
