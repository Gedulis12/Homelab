---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: youtube-downloads
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Mi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: youtube-downloads
spec:
  storageClassName: ""
  capacity:
    storage: 1Mi
  volumeMode: Filesystem
  claimRef:
    name: youtube-downloads
    namespace: media
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  nfs:
    path: /mnt/data/media/downloads/youtube
    server: 192.168.0.135
  mountOptions:
    - noatime
    - hard
    - timeo=600
    - retrans=2

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pinchflat-config
  annotations:
    k8up.io/backup: true
  labels:
    name: pinchflat-config
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Mi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pinchflat-config
spec:
  storageClassName: ""
  capacity:
    storage: 1Mi
  volumeMode: Filesystem
  claimRef:
    name: pinchflat-config
    namespace: media
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  nfs:
    path: /mnt/fast/pinchflat
    server: 192.168.0.222
  mountOptions:
    - noatime
    - hard
    - timeo=600
    - retrans=2
