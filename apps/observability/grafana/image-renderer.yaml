---
# Previously provisioned by the grafana helm chart's imageRenderer subchart.
# Lifted over as plain manifests for the grafana-operator managed instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-image-renderer
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana-image-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-image-renderer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-image-renderer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana-image-renderer
          image: docker.io/grafana/grafana-image-renderer:latest
          imagePullPolicy: Always
          env:
            - name: HTTP_PORT
              value: "8081"
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: grafana-image-renderer-token
            - name: HTTP_HOST
              value: 0.0.0.0
            - name: XDG_CACHE_HOME
              value: /tmp/.chromium
            - name: XDG_CONFIG_HOME
              value: /tmp/.chromium
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp
              name: image-renderer-tmpfs
      volumes:
        - emptyDir: {}
          name: image-renderer-tmpfs

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-image-renderer
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana-image-renderer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: grafana-image-renderer
