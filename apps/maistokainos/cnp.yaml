apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: maistokainos
  namespace: maistokainos
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            pod: cloudflared
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - {}
    - fromEndpoints:
        - matchLabels:
            app: maistokainos
      toPorts:
        - ports:
            - port: "5432"
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
          rules:
            http:
              - {}
        - ports:
            - port: "2000"
              protocol: TCP
          rules:
            http:
              - {}
        - ports:
            - port: "9187"
              protocol: TCP
          rules:
            http:
              - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "4317"
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
    - toFQDNs:
        - matchPattern: "*.v2.argotunnel.com"
      toPorts:
        - ports:
            - port: "7844"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: postgresql
      toPorts:
        - ports:
            - port: "5432"
    - toEndpoints:
        - matchLabels:
            app: maistokainos
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - {}
