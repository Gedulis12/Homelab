---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maistokainos-aws-s3-sync
  namespace: maistokainos
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                          - amd64
          containers:
          - name: aws-s3-sync
            image: amazon/aws-cli:2.39.5
            envFrom:
              - secretRef:
                  name: maistokainos-aws-secret
            env:
              # Enable only after all web pods understand revision declarations.
              - name: SYNC_SNAPSHOT_HEADS
                value: "false"
            command: ["/bin/sh", "/sync/sync.sh"]
            volumeMounts:
              - name: sync-script
                mountPath: /sync
                readOnly: true
              - name: maistokainos-pvc
                mountPath: "/localdata"
          volumes:
            - name: sync-script
              configMap:
                name: maistokainos-sync-script
            - name: maistokainos-pvc
              persistentVolumeClaim:
                claimName: maistokainos-pvc
          restartPolicy: Never
