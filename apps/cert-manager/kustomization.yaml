---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.1/cert-manager.yaml
  - cluster-issuer.yaml
  - sealed-secret.yaml
  - certificate.yaml

helmCharts:
  - name: reflector
    repo: https://emberstack.github.io/helm-charts
    namespace: cert-manager
    version: 10.0.61
    releaseName: reflector

patches:
  # In-cluster DNS forwards g2net.xyz to k8s-gateway, which returns NXDOMAIN for
  # _acme-challenge TXT records — self-check DNS-01 propagation via public resolvers instead.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers-only
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
    target:
      kind: Deployment
      name: cert-manager

